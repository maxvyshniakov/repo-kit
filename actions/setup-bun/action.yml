name: Set up Bun behind the TLS gate
description: >-
  Installs Bun, proves on this runner that it trusts registry.npmjs.org and
  rejects the compromised eMudhra chains, then runs bun install --frozen-lockfile
  with a token for the private GitHub Packages registry.
inputs:
  bun-version:
    description: Bun to install; 1.3.14 and older trust the compromised chains.
    default: "1.4.4"
  install:
    description: Run bun install --frozen-lockfile after the gate.
    default: "true"
  token:
    description: GITHUB_TOKEN for bunfig.toml's @maxvyshniakov scope (read:packages).
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ inputs.bun-version }}
    # The gate is repo-kit's src/tls-gate.mjs, part of this action's checkout,
    # so it runs before any package is installed (README.md#tls-gate).
    - name: Verify Bun public TLS trust before installs and credentials
      shell: bash
      run: bun "$GITHUB_ACTION_PATH/../../src/tls-gate.mjs"
    - if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
