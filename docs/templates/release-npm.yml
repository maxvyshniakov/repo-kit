# A library's .github/workflows/release-npm.yml: publishes the released version
# to npmjs.org with npm trusted publishing (OIDC) and, from a public
# repository, provenance. Copy it under this name; package-kit publish's refusal
# outside Actions names it. The package's package-kit.config.mjs sets
# `publish: { registry: "npm" }` (or ["github", "npm"] while consumers still
# install it from GitHub Packages).
#
# - Register this file once on npmjs.org as the package's trusted publisher:
#   npm trust github <package> --file release-npm.yml --repo <owner>/<repo>
#   (In the web UI, enable "Allow npm publish" under Allowed actions and run
#   this workflow once to validate the connection.)
#   The OIDC claims name this caller's workflow file, so the job stays here
#   and does not move into a reusable workflow.
# - Inside Actions, `package-kit publish` skips the release gate's own wait: the
#   check job below gates the publication.
# - Only the publishing job gets id-token: write and contents: write (the tag);
#   release.yml's permissions stay as they were, so its callers are unchanged.
name: Release to npm
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: release-npm
  cancel-in-progress: false
jobs:
  check:
    uses: maxvyshniakov/package-kit/.github/workflows/verify.yml@v1.2.1
    permissions:
      contents: read
      packages: read
  publish:
    needs: check
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      # GitHub Packages installs the @maxvyshniakov dependencies; with
      # publish.registry ["github", "npm"] make this packages: write.
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: maxvyshniakov/package-kit/actions/setup-bun@v1.2.1
      - uses: maxvyshniakov/package-kit/actions/npm-publish@v1.2.1
