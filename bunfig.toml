# @maxvyshniakov packages live in the private GitHub Packages registry. Installing
# or publishing them needs GITHUB_TOKEN with read:packages (write:packages to
# publish): locally `export GITHUB_TOKEN=$(gh auth token)`, in CI the workflow token.
[install.scopes]
maxvyshniakov = { url = "https://npm.pkg.github.com/", token = "$GITHUB_TOKEN" }
