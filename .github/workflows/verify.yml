# Reusable: the repository's gate, `bun run verify`, as the pre-push hook runs it:
# with --release for main and for a pull request into main, without it elsewhere
# (dev, branches, a manual run on either), where `## Unreleased` may hold
# entries. verify leases `slots` (default all: the whole runner) through
# slotfather, so it never runs beside another repository's heavy job and its
# memory budget is the runner's. Callers keep their workflow at
# .github/workflows/check.yml, which `repo-kit publish` waits for:
#
#   jobs:
#     check:
#       uses: maxvyshniakov/repo-kit/.github/workflows/verify.yml@v0.6.1
#
# The caller grants contents: read and packages: read.
name: verify
on:
  workflow_call:
    inputs:
      args:
        description: Further arguments after `bun run verify --`; --release comes from the ref.
        type: string
        default: ""
      runner:
        description: runs-on, as JSON. A private repository may pass a self-hosted runner, for example '["self-hosted", "homelab"]'; in a public one a self-hosted label fails the job on a GitHub-hosted runner.
        type: string
        default: '["ubuntu-latest"]'
      timeout-minutes:
        type: number
        default: 20
      slots:
        description: slotfather slots the job leases, where the runner has slotfather; all holds the whole runner.
        type: string
        default: all
      slot-wait:
        description: Seconds to wait for that lease before failing with that reason; 0 waits as long as the job runs.
        type: number
        default: 0
      verified-url:
        description: A link to a passed result of this tree and plan, from verified-tree.yml's urls output. When set, the job skips every step and links it.
        type: string
        default: ""
      junit:
        description: Paths or globs of JUnit reports the commands write, uploaded as an artifact after the job; empty uploads nothing.
        type: string
        default: ""
      junit-artifact:
        description: The artifact's name; set it when a workflow calls this one twice with junit.
        type: string
        default: ""
      fetch-depth:
        description: actions/checkout's fetch-depth. 0 fetches every branch's history, which a verify step running `repo-kit check-changelog-entries origin/main..HEAD` needs.
        type: number
        default: 1
jobs:
  verify:
    runs-on: ${{ github.event.repository.visibility == 'public' && contains(inputs.runner, 'self-hosted') && fromJSON('["ubuntu-latest"]') || fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Never more than the caller grants; never more than reading the code and packages.
    permissions:
      contents: read
      packages: read
    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"
      # bunfig.toml reads @maxvyshniakov packages from GitHub Packages with this
      # token, here and in the packed-consumer check's install.
      GITHUB_TOKEN: ${{ github.token }}
      REPO_KIT_SLOT_WAIT: ${{ inputs.slot-wait }}
      REPO_KIT_VERIFY_SLOTS: ${{ inputs.slots }}
    steps:
      - name: Refuse a self-hosted runner in a public repository
        if: ${{ github.event.repository.visibility == 'public' && contains(inputs.runner, 'self-hosted') }}
        run: |
          echo "::error::A public repository must not run this workflow on a self-hosted runner: a pull request from a fork chooses the code it runs. Drop the runner input to use ubuntu-latest."
          exit 1
      - name: Reuse the passed result of this tree
        if: inputs.verified-url != ''
        run: echo "This tree already passed these checks, so they do not run again. Result reused - $VERIFIED_URL" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          VERIFIED_URL: ${{ inputs.verified-url }}
      - if: inputs.verified-url == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      - if: inputs.verified-url == ''
        uses: maxvyshniakov/repo-kit/actions/setup-bun@v0.6.1
      - if: inputs.verified-url == ''
        run: bun run verify -- $RELEASE_ARGS $VERIFY_ARGS
        env:
          RELEASE_ARGS: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && '--release' || '' }}
          VERIFY_ARGS: ${{ inputs.args }}
      - name: Upload JUnit reports
        if: ${{ always() && inputs.junit != '' && inputs.verified-url == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.junit-artifact || format('junit-{0}-{1}', github.job, github.run_attempt) }}
          path: ${{ inputs.junit }}
          if-no-files-found: warn
          retention-days: 30
