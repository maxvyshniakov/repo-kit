# Reusable: builds Storybook and publishes it to the caller's Cloudflare host.
# The caller decides when (main pushes and dispatches) and after which jobs, and
# passes their results; `repo-kit ci-gate` then follows release.gate in
# repo-kit.config.mjs: under "local" the checks are advisory and the deploy runs
# whatever they concluded; under "ci" it deploys only when every one passed:
#
#   jobs:
#     deploy:
#       needs: [check, browser]
#       if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
#       uses: maxvyshniakov/repo-kit/.github/workflows/deploy-storybook.yml@v0.6.2
#       with:
#         url: https://sid-kit.maxvyshniakov.com
#         needs: ${{ toJSON(needs) }}
#       secrets: inherit
#
# A caller without `needs:` here and without !cancelled() deploys only after its
# needed jobs passed, as before release.gate existed.
#
# STORYBOOK_CLOUDFLARE_API_TOKEN is a secret of the `storybook` environment, not
# of the repository. A caller job cannot read environment secrets, so this job,
# which declares the environment, reads it by name; `secrets: inherit` makes the
# name available here. The caller grants contents: read and packages: read.
name: deploy-storybook
on:
  workflow_call:
    inputs:
      url:
        type: string
        required: true
      environment:
        type: string
        default: storybook
      needs:
        description: The caller's toJSON(needs); repo-kit ci-gate deploys after a failed one only under release.gate "local".
        type: string
        default: "{}"
      runner:
        description: runs-on, as JSON. A private repository may pass a self-hosted runner, for example '["self-hosted", "homelab"]'; in a public one a self-hosted label fails the job on a GitHub-hosted runner.
        type: string
        default: '["ubuntu-latest"]'
      slots:
        description: slotfather slots the builds lease, where the runner has slotfather; all holds the whole runner.
        type: string
        default: all
      slot-wait:
        description: Seconds to wait for that lease before failing with that reason; 0 waits as long as the job runs.
        type: number
        default: 0
      timeout-minutes:
        description: Includes the wait for the lease.
        type: number
        default: 30
    secrets:
      STORYBOOK_CLOUDFLARE_API_TOKEN:
        description: Read from the environment named by `environment`.
        required: false
jobs:
  deploy:
    name: Publish private Storybook
    runs-on: ${{ github.event.repository.visibility == 'public' && contains(inputs.runner, 'self-hosted') && fromJSON('["ubuntu-latest"]') || fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - name: Refuse a self-hosted runner in a public repository
        if: ${{ github.event.repository.visibility == 'public' && contains(inputs.runner, 'self-hosted') }}
        run: |
          echo "::error::A public repository must not run this workflow on a self-hosted runner: a pull request from a fork chooses the code it runs. Drop the runner input to use ubuntu-latest."
          exit 1
      - name: Require the environment's Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::STORYBOOK_CLOUDFLARE_API_TOKEN is empty: add it to the $ENVIRONMENT environment and call this workflow with secrets: inherit"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STORYBOOK_CLOUDFLARE_API_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: maxvyshniakov/repo-kit/actions/setup-bun@v0.6.2
      # release.gate "local": the checks are advisory, deploy anyway; "ci": only
      # after every needed job passed. Writes run=true|false.
      - id: gate
        run: node_modules/.bin/repo-kit ci-gate
        env:
          REPO_KIT_NEEDS: ${{ inputs.needs }}
      # The builds are heavy: they run under one lease, like every heavy job here.
      - if: steps.gate.outputs.run == 'true'
        run: node_modules/.bin/repo-kit heavy "$SLOTS" sh -c 'bun run build && bun run storybook:build'
        env:
          SLOTS: ${{ inputs.slots }}
          REPO_KIT_SLOT_WAIT: ${{ inputs.slot-wait }}
      # It installs and builds the Storybooks of the retained releases: heavy too.
      - if: steps.gate.outputs.run == 'true'
        run: node_modules/.bin/repo-kit heavy "$SLOTS" bun run storybook:prepare-deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOTS: ${{ inputs.slots }}
          REPO_KIT_SLOT_WAIT: ${{ inputs.slot-wait }}
      - if: steps.gate.outputs.run == 'true'
        run: bun run storybook:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STORYBOOK_CLOUDFLARE_API_TOKEN }}
