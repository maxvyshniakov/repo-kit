# Reusable: publishes from CI, as Data Grid's automated dependency release does.
# `repo-kit publish` skips waiting for the checks workflow inside Actions, so
# the caller orders this job after its check jobs. With enabled: false the job
# runs and does nothing, so jobs that need it still run:
#
#   jobs:
#     dependency-release:
#       needs: [check, browser]
#       uses: maxvyshniakov/repo-kit/.github/workflows/release.yml@v0.6.1
#       with:
#         command: node scripts/publish-catalog-release.mjs
#         enabled: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
#
# The caller grants contents: write and packages: write.
name: release
on:
  workflow_call:
    inputs:
      command:
        type: string
        default: bun run release:publish
      enabled:
        type: boolean
        default: true
      runner:
        description: runs-on, as JSON. A private repository may pass a self-hosted runner, for example '["self-hosted", "homelab"]'; in a public one a self-hosted label fails the job on a GitHub-hosted runner.
        type: string
        default: '["ubuntu-latest"]'
      slots:
        description: slotfather slots the job leases, where the runner has slotfather; all holds the whole runner.
        type: string
        default: all
      slot-wait:
        description: Seconds to wait for that lease before failing with that reason; 0 waits as long as the job runs.
        type: number
        default: 0
      timeout-minutes:
        description: Includes the wait for the lease.
        type: number
        default: 30
jobs:
  release:
    name: Publish
    runs-on: ${{ github.event.repository.visibility == 'public' && contains(inputs.runner, 'self-hosted') && fromJSON('["ubuntu-latest"]') || fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Refuse a self-hosted runner in a public repository
        if: ${{ github.event.repository.visibility == 'public' && contains(inputs.runner, 'self-hosted') }}
        run: |
          echo "::error::A public repository must not run this workflow on a self-hosted runner: a pull request from a fork chooses the code it runs. Drop the runner input to use ubuntu-latest."
          exit 1
      - if: inputs.enabled
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - if: inputs.enabled
        uses: maxvyshniakov/repo-kit/actions/setup-bun@v0.6.1
      # Publishing builds the package (prepack): it runs under a lease, like every
      # heavy job here.
      - if: inputs.enabled
        run: node_modules/.bin/repo-kit heavy "$SLOTS" sh -c 'eval "$COMMAND"'
        env:
          COMMAND: ${{ inputs.command }}
          GITHUB_TOKEN: ${{ github.token }}
          SLOTS: ${{ inputs.slots }}
          REPO_KIT_SLOT_WAIT: ${{ inputs.slot-wait }}
