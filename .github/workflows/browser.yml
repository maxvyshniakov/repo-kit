# Reusable: browser checks against a static Storybook build. One job builds it
# once and runs every check after it, in order, under one slotfather lease:
# with the whole runner leased the checks could not run side by side anyway,
# and a job per check built Storybook once per check: three concurrent builds
# exhausted a 10 GiB runner. Every
# check runs, after a failed one too; the job fails naming the failed ones.
#
#   jobs:
#     browser:
#       uses: maxvyshniakov/repo-kit/.github/workflows/browser.yml@v0.7.0
#       with:
#         checks: >-
#           [{"name": "stories", "run": "bun run check:stories -- --no-build"}]
#
# The caller grants contents: read and packages: read.
name: browser
on:
  workflow_call:
    inputs:
      checks:
        description: 'JSON list of {"name", "run"}; each runs in turn after the build, in one job.'
        type: string
        required: true
      build:
        description: Commands that build what the checks read.
        type: string
        default: bun run build && bun run storybook:build
      playwright:
        description: Install Playwright's Chromium, pinned by the Playwright version in bun.lock.
        type: boolean
        default: true
      runner:
        description: runs-on, as JSON. A private repository may pass a self-hosted runner, for example '["self-hosted", "homelab"]'; in a public one a self-hosted label fails the job on a GitHub-hosted runner.
        type: string
        default: '["ubuntu-latest"]'
      slots:
        description: slotfather slots the job leases, where the runner has slotfather; all holds the whole runner.
        type: string
        default: all
      slot-wait:
        description: Seconds to wait for that lease before failing with that reason; 0 waits as long as the job runs.
        type: number
        default: 0
      verified-url:
        description: A link to a passed result of this tree and plan, from verified-tree.yml's urls output. When set, the job skips every step and links it.
        type: string
        default: ""
      junit:
        description: Paths or globs of JUnit reports the checks write, uploaded as an artifact after the job; empty uploads nothing.
        type: string
        default: ""
      junit-artifact:
        description: The artifact's name; set it when a workflow calls this one twice with junit.
        type: string
        default: ""
      timeout-minutes:
        description: Covers the wait for the lease, the build and every check.
        type: number
        default: 45
jobs:
  browser:
    name: ${{ join(fromJSON(inputs.checks).*.name, ' + ') }}
    runs-on: ${{ github.event.repository.visibility == 'public' && contains(inputs.runner, 'self-hosted') && fromJSON('["ubuntu-latest"]') || fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Never more than the caller grants; never more than reading the code and packages.
    permissions:
      contents: read
      packages: read
    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"
      GITHUB_TOKEN: ${{ github.token }}
      REPO_KIT_SLOT_WAIT: ${{ inputs.slot-wait }}
    steps:
      - name: Refuse a self-hosted runner in a public repository
        if: ${{ github.event.repository.visibility == 'public' && contains(inputs.runner, 'self-hosted') }}
        run: |
          echo "::error::A public repository must not run this workflow on a self-hosted runner: a pull request from a fork chooses the code it runs. Drop the runner input to use ubuntu-latest."
          exit 1
      - name: Reuse the passed result of this tree
        if: inputs.verified-url != ''
        run: echo "This tree already passed these checks, so they do not run again. Result reused - $VERIFIED_URL" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          VERIFIED_URL: ${{ inputs.verified-url }}
      - if: inputs.verified-url == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: inputs.verified-url == ''
        uses: maxvyshniakov/repo-kit/actions/setup-bun@v0.7.0
      # The runner must provide Chromium's system libraries; a persistent
      # self-hosted runner keeps downloaded browsers per Playwright version.
      - if: inputs.playwright && inputs.verified-url == ''
        run: bunx playwright install --no-shell chromium
      # The build and the checks run under one lease, so the build queues with
      # the runner's other jobs too; a check that leases again (repo-kit heavy)
      # runs inside it.
      - if: inputs.verified-url == ''
        run: node_modules/.bin/repo-kit heavy "$SLOTS" sh -c 'eval "$BUILD" && node_modules/.bin/repo-kit checks'
        env:
          SLOTS: ${{ inputs.slots }}
          BUILD: ${{ inputs.build }}
          REPO_KIT_CHECKS: ${{ inputs.checks }}
          # Per-check timings as JUnit, uploaded with the caller's reports.
          REPO_KIT_CHECKS_JUNIT: ${{ inputs.junit != '' && 'repo-kit-junit/checks.xml' || '' }}
      - name: Upload JUnit reports
        if: ${{ always() && inputs.junit != '' && inputs.verified-url == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.junit-artifact || format('junit-{0}-{1}', github.job, github.run_attempt) }}
          path: |
            ${{ inputs.junit }}
            repo-kit-junit/
          if-no-files-found: warn
          retention-days: 30
